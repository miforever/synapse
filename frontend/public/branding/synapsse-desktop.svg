<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%" fill="none">
  <!-- Container Canvas: Deep Midnight Violet -->
  <rect width="320" height="80" fill="#0A0814" rx="8" stroke="#231F3D" stroke-width="1" />

  <!-- Mark Area (Left) -->
  <g transform="translate(10, 0)">
    <!-- Outer Hex Frame: Slate Indigo -->
    <polygon points="40,16 62,28 62,52 40,64 18,52 18,28" stroke="#3730A3" stroke-width="1.5" fill="none" />

    <!-- Main 3D Axis -->
    <line x1="40" y1="16" x2="40" y2="40" stroke="#FAFAFA" stroke-width="2" stroke-linecap="round" />
    <line x1="18" y1="52" x2="40" y2="40" stroke="#FAFAFA" stroke-width="2" stroke-linecap="round" />
    <line x1="62" y1="52" x2="40" y2="40" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" />

    <!-- Isometric Face Connectors: Violet top ray vs Cyan front ray -->
    <line x1="40" y1="16" x2="62" y2="28" stroke="#A855F7" stroke-width="2" stroke-linecap="round" />
    <line x1="18" y1="28" x2="40" y2="40" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="3 2" />
    <line x1="40" y1="64" x2="40" y2="40" stroke="#A855F7" stroke-width="2" stroke-linecap="round" />

    <!-- Vertex Nodes -->
    <circle cx="40" cy="16" r="3.5" fill="#FAFAFA" />
    <circle cx="62" cy="28" r="3.5" fill="#A855F7" />
    <circle cx="62" cy="52" r="3.5" fill="#00F0FF" />
    <circle cx="40" cy="64" r="3.5" fill="#A855F7" />
    <circle cx="18" cy="52" r="3.5" fill="#FAFAFA" />
    <circle cx="18" cy="28" r="3.5" fill="#FAFAFA" />

    <!-- Active Core Junction -->
    <circle cx="40" cy="40" r="5" fill="#00F0FF" />
    <circle cx="40" cy="40" r="8" stroke="#A855F7" stroke-width="1.2" fill="none" />
  </g>

  <!-- Logotype -->
  <text x="92" y="43" fill="#FAFAFA" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" letter-spacing="0.12em">SYNAPSSE</text>
  <text x="94" y="58" fill="#818CF8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" font-weight="500" letter-spacing="0.25em">MEMORY GRAPH DAEMON</text>
</svg>
