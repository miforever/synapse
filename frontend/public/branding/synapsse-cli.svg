<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%" fill="none">
  <!-- Container Canvas: Deep Navy Obsidian -->
  <rect width="320" height="80" fill="#070A10" rx="8" stroke="#1E293B" stroke-width="1" />

  <!-- Mark Area (Left) -->
  <g transform="translate(10, 0)">
    <!-- Outer Hex Frame: Muted Slate Blue -->
    <polygon points="40,16 62,28 62,52 40,64 18,52 18,28" stroke="#334155" stroke-width="1.5" fill="none" />

    <!-- Main 3D Axis: Crisp Ice Blue -->
    <line x1="40" y1="16" x2="40" y2="40" stroke="#F1F5F9" stroke-width="2" stroke-linecap="round" />
    <line x1="18" y1="52" x2="40" y2="40" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
    <line x1="62" y1="52" x2="40" y2="40" stroke="#00F6FF" stroke-width="2.5" stroke-linecap="round" />

    <!-- Isometric Face Connectors: Secondary Muted Blue & Cyan Vector -->
    <line x1="40" y1="16" x2="62" y2="28" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
    <line x1="18" y1="28" x2="40" y2="40" stroke="#00F6FF" stroke-width="1.5" stroke-dasharray="3 2" />
    <line x1="40" y1="64" x2="40" y2="40" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />

    <!-- Vertex Nodes -->
    <circle cx="40" cy="16" r="3.5" fill="#F1F5F9" />
    <circle cx="62" cy="28" r="3.5" fill="#94A3B8" />
    <circle cx="62" cy="52" r="3.5" fill="#00F6FF" />
    <circle cx="40" cy="64" r="3.5" fill="#CBD5E1" />
    <circle cx="18" cy="52" r="3.5" fill="#CBD5E1" />
    <circle cx="18" cy="28" r="3.5" fill="#94A3B8" />

    <!-- Active Core Junction -->
    <circle cx="40" cy="40" r="5" fill="#00F6FF" />
    <circle cx="40" cy="40" r="8" stroke="#F1F5F9" stroke-width="1.2" fill="none" />
  </g>

  <!-- Logotype -->
  <text x="92" y="43" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" letter-spacing="0.12em">SYNAPSSE</text>
  <text x="94" y="58" fill="#64748B" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" font-weight="500" letter-spacing="0.25em">MEMORY GRAPH DAEMON</text>
</svg>
